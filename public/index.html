<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmeTV Clone</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Socket.io Library -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <header>
    <div class="logo">OmeTV Clone</div>
    <div class="status">Online: <b id="onlineCount">1</b></div>
  </header>

  <div class="app-container">
    <!-- Left Section: Videos + Controls -->
    <div class="video-section">
      <div class="video-grid">
        <!-- Stranger Video -->
        <div class="video-box">
          <span class="video-label">Stranger</span>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <!-- Local User Video -->
        <div class="video-box">
          <span class="video-label">You</span>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="controls">
        <button class="btn btn-start" id="startBtn">Start</button>
        <button class="btn btn-next" id="nextBtn">Next (Skip)</button>
        <button class="btn btn-stop" id="stopBtn">Stop</button>
      </div>
    </div>

    <!-- Right Section: Chat Panel -->
    <div class="side-panel">
      <div class="chat-messages" id="chatMessages">
        <p class="system-msg">System: Click Start to begin video chat.</p>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button class="btn btn-next" id="sendBtn" style="padding: 10px 18px;">Send</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
